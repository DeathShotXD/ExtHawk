<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="ltitle ldesc">
  <title id="ltitle">ExtHawk A/B lab: HawkNotes 1.0.0 is exploitable, HawkNotes 1.0.1 is patched</title>
  <desc id="ldesc">Two builds of the same extension id are scanned and driven in headless Chromium. The vulnerable build confirms five payloads; the patched build confirms none.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset=".55" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="lred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="lgreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0c0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#35d0c0" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="lgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#35d0c0" stroke-opacity=".045"/>
    </pattern>
    <pattern id="ldots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".9" fill="#e7e2d8" fill-opacity=".035"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 10.5px; letter-spacing: 2.2px; fill: #6f8093; }
      .h { font-size: 19px; font-weight: 800; letter-spacing: .2px; fill: #e7e2d8; }
      .v { font-size: 10.5px; letter-spacing: .8px; fill: #6f8093; }
      .item { font-size: 11.5px; letter-spacing: .1px; fill: #aab6c4; }
      .grade { font-size: 25px; font-weight: 900; letter-spacing: -.5px; }
      .res { font-size: 15px; font-weight: 800; letter-spacing: .4px; }
      .chip { font-size: 9.5px; letter-spacing: .8px; }
      .pulse { animation: lpulse 3.2s ease-in-out infinite; }
      @keyframes lpulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="450" fill="url(#lbg)"/>
  <rect width="1200" height="450" fill="url(#lgrid)"/>
  <rect width="1200" height="450" fill="url(#ldots)"/>

  <text x="40" y="38" class="mono kicker">THE LAB / A/B OR NOTHING</text>
  <text x="1160" y="38" text-anchor="end" class="mono kicker">SAME ID / SAME BROWSER / DIFFERENT CODE</text>

  <!-- left panel -->
  <g transform="translate(40 68)">
    <rect width="520" height="286" rx="12" fill="#0d080d" stroke="#ff5c7a" stroke-opacity=".36"/>
    <rect x="0" y="0" width="520" height="4" rx="2" fill="url(#lred)"/>
    <text x="24" y="34" class="mono v">VULNERABLE BUILD</text>
    <text x="24" y="62" class="mono h">HawkNotes 1.0.0</text>
    <text x="496" y="62" text-anchor="end" class="mono chip" fill="#ff5c7a">MV3 / EXPLOITABLE</text>

    <text x="24" y="96" class="mono v">STATIC GRADE</text>
    <text x="24" y="128" class="mono grade" fill="#ff5c7a">CRITICAL</text>
    <text x="188" y="128" class="mono v">100/100</text>

    <path d="M24 146 H496" stroke="#ff5c7a" stroke-opacity=".18"/>
    <text x="24" y="172" class="mono item">- externally_connectable matches 127.0.0.1</text>
    <text x="24" y="192" class="mono item">- onMessageExternal with no sender check</text>
    <text x="24" y="212" class="mono item">- cookies + scripting + eval in the handler</text>
    <text x="24" y="232" class="mono item">- content script: postMessage -&gt; innerHTML</text>
    <text x="24" y="252" class="mono item">- panel.html: hash -&gt; innerHTML</text>

    <path d="M24 268 H496" stroke="#ff5c7a" stroke-opacity=".18"/>
    <text x="24" y="290" class="mono res" fill="#ff5c7a">5/5 payloads confirmed</text>
    <circle cx="496" cy="286" r="4" fill="#ff5c7a" class="pulse"/>
  </g>

  <!-- right panel -->
  <g transform="translate(640 68)">
    <rect width="520" height="286" rx="12" fill="#080d0d" stroke="#35d0c0" stroke-opacity=".4"/>
    <rect x="0" y="0" width="520" height="4" rx="2" fill="url(#lgreen)"/>
    <text x="24" y="34" class="mono v">PATCHED BUILD</text>
    <text x="24" y="62" class="mono h">HawkNotes 1.0.1</text>
    <text x="496" y="62" text-anchor="end" class="mono chip" fill="#35d0c0">MV3 / CLEAN</text>

    <text x="24" y="96" class="mono v">STATIC GRADE</text>
    <text x="24" y="128" class="mono grade" fill="#35d0c0">CLEAN</text>
    <text x="188" y="128" class="mono v">0/100</text>

    <path d="M24 146 H496" stroke="#35d0c0" stroke-opacity=".18"/>
    <text x="24" y="172" class="mono item">- no externally_connectable</text>
    <text x="24" y="192" class="mono item">- no external message handler</text>
    <text x="24" y="212" class="mono item">- no cookies, scripting, or host access</text>
    <text x="24" y="232" class="mono item">- textContent, not innerHTML</text>
    <text x="24" y="252" class="mono item">- explicit strict extension CSP</text>

    <path d="M24 268 H496" stroke="#35d0c0" stroke-opacity=".18"/>
    <text x="24" y="290" class="mono res" fill="#35d0c0">0/5 payloads confirmed</text>
    <circle cx="496" cy="286" r="4" fill="#35d0c0" class="pulse"/>
  </g>

  <!-- same id -->
  <g transform="translate(560 196)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#0a0f16" stroke="#22303f"/>
    <text x="40" y="20" text-anchor="middle" class="mono chip" fill="#a78bfa">SAME ID</text>
  </g>

  <!-- footer -->
  <g transform="translate(40 378)">
    <rect width="1120" height="42" rx="8" fill="#080d14" stroke="#22303f"/>
    <text x="18" y="26" class="mono item" fill="#35d0c0">$</text>
    <text x="38" y="26" class="mono item" fill="#e7e2d8">./lab/run.sh</text>
    <text x="170" y="26" class="mono item" fill="#6f8093">-&gt;</text>
    <text x="198" y="26" class="mono item" fill="#ff5c7a">vulnerable: exploit confirmed</text>
    <text x="470" y="26" class="mono item" fill="#6f8093">/</text>
    <text x="492" y="26" class="mono item" fill="#35d0c0">patched: no exploit</text>
    <text x="730" y="26" class="mono item" fill="#6f8093">/</text>
    <text x="752" y="26" class="mono item" fill="#a78bfa">A/B lab complete</text>
    <text x="1102" y="26" text-anchor="end" class="mono chip" fill="#6f8093">REAL CHROMIUM</text>
  </g>
</svg>
