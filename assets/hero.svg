<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="htitle hdesc">
  <title id="htitle">ExtHawk - browser extension attack surface scanner and exploit harness</title>
  <desc id="hdesc">ExtHawk maps an extension's manifest and code, computes its id, and proves exploitability in headless Chromium.</desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset=".55" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="hcyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0c0"/>
      <stop offset="1" stop-color="#2ee6d6"/>
    </linearGradient>
    <linearGradient id="hviolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0c0" stop-opacity=".0"/>
      <stop offset=".2" stop-color="#35d0c0" stop-opacity=".8"/>
      <stop offset=".8" stop-color="#a78bfa" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".0"/>
    </linearGradient>
    <pattern id="hgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#35d0c0" stroke-opacity=".045"/>
    </pattern>
    <pattern id="hdots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".85" fill="#e7e2d8" fill-opacity=".035"/>
    </pattern>
    <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 10.5px; letter-spacing: 2.4px; fill: #6f8093; }
      .word { font-size: 66px; font-weight: 900; letter-spacing: -2.5px; fill: #e7e2d8; }
      .word2 { font-size: 66px; font-weight: 900; letter-spacing: -2.5px; fill: url(#hcyan); }
      .tag { font-size: 15px; letter-spacing: .2px; fill: #aab6c4; }
      .small { font-size: 10.5px; letter-spacing: .8px; fill: #6f8093; }
      .term { font-size: 12.5px; letter-spacing: .1px; }
      .pulse { animation: hpulse 3.2s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 7; animation: hflow 2.1s linear infinite; }
      @keyframes hpulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes hflow { to { stroke-dashoffset: -48; } }
      @media (prefers-reduced-motion: reduce) { .pulse,.flow { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="430" fill="url(#hbg)"/>
  <rect width="1200" height="430" fill="url(#hgrid)"/>
  <rect width="1200" height="430" fill="url(#hdots)"/>

  <text x="52" y="46" class="mono kicker">EXTHAWK / BROWSER EXTENSION ATTACK SURFACE</text>
  <text x="1148" y="46" text-anchor="end" class="mono kicker">STATIC + DYNAMIC / AUTHORIZED LAB</text>

  <!-- wordmark -->
  <text x="50" y="142" class="mono word">Ext</text>
  <text x="176" y="142" class="mono word2">Hawk</text>
  <text x="52" y="178" class="mono tag">Map the extension. Drive the bridge. Prove the impact.</text>
  <text x="52" y="204" class="mono small">ONE FILE / STDLIB ONLY / CRX2 + CRX3 / MV3 LAB</text>

  <!-- hawk eye mark -->
  <g transform="translate(1062 116)">
    <circle r="74" fill="#080c12" stroke="#35d0c0" stroke-opacity=".18"/>
    <circle r="58" fill="none" stroke="#35d0c0" stroke-opacity=".22" stroke-dasharray="3 7"/>
    <path d="M-46 0 C-26 -30 26 -30 46 0 C26 30 -26 30 -46 0 Z" fill="#0a1119" stroke="url(#hcyan)" stroke-width="1.6"/>
    <circle r="17" fill="#0a1119" stroke="#a78bfa" stroke-width="1.4"/>
    <circle r="8" fill="url(#hviolet)" filter="url(#hglow)" class="pulse"/>
    <circle cx="-5" cy="-5" r="2.2" fill="#e7e2d8" opacity=".85"/>
    <path d="M-58 30 L-40 18 M58 30 L40 18" stroke="#35d0c0" stroke-opacity=".35" stroke-width="1.2"/>
  </g>

  <!-- terminal card -->
  <g transform="translate(52 250)">
    <rect width="650" height="142" rx="10" fill="#080d14" stroke="#22303f"/>
    <rect x="0" y="0" width="650" height="30" rx="10" fill="#0b1119"/>
    <rect x="0" y="20" width="650" height="10" fill="#0b1119"/>
    <circle cx="18" cy="15" r="3.2" fill="#ff5c7a"/>
    <circle cx="30" cy="15" r="3.2" fill="#f0b45a"/>
    <circle cx="42" cy="15" r="3.2" fill="#35d0c0"/>
    <text x="62" y="19" class="mono small">exthawk / lab</text>
    <text x="632" y="19" text-anchor="end" class="mono small" fill="#a78bfa">AUTHORIZED</text>

    <text x="18" y="56" class="mono term" fill="#35d0c0">$</text>
    <text x="36" y="56" class="mono term" fill="#e7e2d8">python3 exthawk.py scan -e lab/extension-vuln</text>
    <text x="18" y="78" class="mono term" fill="#ff5c7a">grade</text>
    <text x="76" y="78" class="mono term" fill="#e7e2d8">CRITICAL</text>
    <text x="160" y="78" class="mono term" fill="#6f8093">100/100</text>
    <text x="18" y="99" class="mono term" fill="#aab6c4">external handler -&gt; cookies / scripting / eval</text>
    <text x="18" y="121" class="mono term" fill="#35d0c0">$</text>
    <text x="36" y="121" class="mono term" fill="#e7e2d8">python3 exthawk.py exploit -e lab/extension-vuln</text>
    <text x="420" y="121" class="mono term" fill="#35d0c0">5/5 confirmed</text>
  </g>

  <!-- bridge card -->
  <g transform="translate(730 250)">
    <rect width="418" height="142" rx="10" fill="#080d14" stroke="#22303f"/>
    <text x="18" y="26" class="mono small" fill="#a78bfa">THE BRIDGE</text>
    <text x="18" y="50" class="mono term" fill="#e7e2d8">page</text>
    <text x="76" y="50" class="mono term" fill="#6f8093">-&gt;</text>
    <text x="104" y="50" class="mono term" fill="#35d0c0">externally_connectable</text>
    <text x="18" y="72" class="mono term" fill="#e7e2d8">page</text>
    <text x="76" y="72" class="mono term" fill="#6f8093">-&gt;</text>
    <text x="104" y="72" class="mono term" fill="#35d0c0">onMessageExternal</text>
    <text x="18" y="94" class="mono term" fill="#e7e2d8">handler</text>
    <text x="90" y="94" class="mono term" fill="#6f8093">-&gt;</text>
    <text x="118" y="94" class="mono term" fill="#f0b45a">cookies / scripting / fetch</text>
    <path d="M18 112 H400" stroke="url(#hline)" stroke-width="1.2"/>
    <text x="18" y="132" class="mono small" fill="#6f8093">if the bridge is open, the browser is the confused deputy.</text>
  </g>

  <path d="M52 414 H1148" stroke="url(#hline)" stroke-width="1"/>
</svg>
